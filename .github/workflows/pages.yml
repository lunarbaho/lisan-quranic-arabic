# Publishes the app/ folder to GitHub Pages.
# One-time setup: Settings → Pages → "Build and deployment" → Source: GitHub Actions.
name: Deploy Lisan to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # each release gets its own offline snapshot: stamp the commit into the service worker
      - name: Stamp the release into the service worker
        run: |
          sed -i "s/^const VERSION = 'lisan-dev';/const VERSION = '${GITHUB_SHA::12}';/" app/sw.js
          grep -q "^const VERSION = '${GITHUB_SHA::12}';" app/sw.js
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v5
